[project]
name = "mixed-signals"
version = "0.1.0.dev0"
description = "Quality checks for single posteriors and comparisons between posteriors, each number reported against a finite-sample null."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "coen-rondeel", email = "coen.rondeel@gmail.com" },
]
requires-python = ">=3.12"
keywords = [
    "bayesian inference",
    "gravitational waves",
    "jax",
    "lisa",
    "mcmc diagnostics",
    "optimal transport",
    "posterior comparison",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.11.2",
    "jaxtyping>=0.3.11",
    "numpy>=2.5.4",
    "ott-jax>=0.6.0",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
mixed-signals = "mixed_signals.cli:main"

[project.urls]
Repository = "https://github.com/coen-rondeel/mixed-signals"
Issues = "https://github.com/coen-rondeel/mixed-signals/issues"

[project.optional-dependencies]
eryn = [
    "eryn",
]
gw = [
    "astropy>=7.2.4",
    "lisaconstants>=2.0.2",
]
hdf5 = [
    "h5py>=3.16.0",
]
plot = [
    "cantuccio>=0.5.0",
]
report = [
    "cantuccio>=0.5.0",
    "marimo>=0.25.1",
]
torch = [
    "torch>=2.14.1",
]
# * One extra per CUDA major version: the JAX CUDA plugin and the matching CuPy wheel.
cuda12 = [
    "cupy-cuda12x>=14.2.0",
    "jax[cuda12]>=0.11.2",
]
cuda13 = [
    "cupy-cuda13x>=14.2.0",
    "jax[cuda13]>=0.11.2",
]

[dependency-groups]
# * The default environment carries every extra except the CUDA ones, which need a GPU.
dev = [
    "mixed-signals[eryn,gw,hdf5,plot,report,torch]",
    { include-group = "test" },
    { include-group = "lint" },
]
test = [
    "beartype>=0.23.1",
    "emcee>=3.1.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
lint = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
    "scipy-stubs>=1.18.1.1",
    "ty>=0.0.107",
    "types-pyyaml>=6.0.12.20260906",
]
docs = [
    "furo>=2025.12.19",
    "ipykernel>=7.4.0",
    "myst-nb>=1.4.0",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinxcontrib-bibtex>=2.7.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13"
# * Both CUDA extras provide the cupy module, so an environment holds one of them.
conflicts = [
    [{ extra = "cuda12" }, { extra = "cuda13" }],
]

[tool.uv.sources]
# ! Development only: eryn's JAX priors live on feat-jaxpriors until their release.
eryn = { git = "https://github.com/lisa-analysis-tools/Eryn", branch = "feat-jaxpriors" }
# ! Development only: the memory-bounded online mode of ott-jax 0.6.0 fails on JAX 0.9 and
# ! later; main fixed it in June 2026 (ott-jax pull request 701), unreleased so far.
ott-jax = { git = "https://github.com/ott-jax/ott", rev = "36338c94707002772f2392ffa0a3acf11ab23857" }
# * Development installs CPU-only torch; macOS wheels on PyPI are CPU-only already.
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Rule set follows the LISA DDPC Python guidelines, extended with bug and naming checks.
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "D",   # docstrings
    "UP",  # modern syntax
    "B",   # likely bugs
    "C4",  # comprehensions
    "N",   # PEP 8 naming
    "NPY", # NumPy-specific rules
    "PT",  # pytest style
    "RUF", # ruff-specific rules
    "SIM", # simplifications
]
# * jaxtyping shape strings such as "sample param" are not Python, but F722 parses them as annotations.
ignore = ["F722"]
# * Scientific docstrings write σ, ρ, α, ν, ℓ, ι, 𝓜, 𝒜, ×, ′ and the minus sign −, which the confusable-character rules flag.
allowed-confusables = ["σ", "ρ", "α", "ν", "ℓ", "−", "𝓜", "𝒜", "ι", "×", "′"]

[tool.ruff.lint.per-file-ignores]
# * Re-exports in the package root must follow the float64 switch.
"src/mixed_signals/__init__.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["src", "tests", "scripts", "docs/conf.py"]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# ? eryn ships without type information; only the two eryn adapter modules import it.
module = ["eryn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ? cantuccio ships without type information; only the report modules import it.
module = ["cantuccio", "cantuccio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ? astropy and lisaconstants ship without type information; only gw.lisa and its tests import them.
module = ["astropy", "astropy.*", "lisaconstants", "lisaconstants.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ? marimo cells are untyped functions whose parameters are the names of other cells.
module = ["mixed_signals.report.notebook"]
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# ? CuPy needs CUDA, so the lint environment does not install it.
module = ["cupy", "cupy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ? The lint environment lacks the docs group, so docs/conf.py sees no Sphinx extensions.
module = ["sphinxcontrib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ? Without the docs group, the citation style that docs/conf.py extends is untyped.
module = ["conf"]
disallow_subclassing_any = false

[tool.ty.src]
# ? Strict mypy stays the type checker. The hook and CI run only ty's deprecated rule,
# ? which reports the typeshed deprecations that mypy's own stubs revert.
include = ["src", "tests", "scripts", "docs/conf.py"]

[tool.ty.environment]
# ? mypy finds zoo_validation through its file list, while ty needs scripts on its search path.
extra-paths = ["scripts"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "-m", "not gpu",
    "--jaxtyping-packages=mixed_signals,beartype.beartype",
]
markers = [
    "gpu: needs a CUDA GPU; skipped by default, run by hand with `pytest -m gpu`",
]
filterwarnings = [
    "error",
    # ? ott-jax imports jaxopt, which warns on import that it is no longer maintained.
    "ignore:JAXopt is no longer maintained:DeprecationWarning",
    # ? lisaconstants 2.0.2 warns at import under astropy 8 about a constant that gw.lisa does not use.
    "ignore:The following constants differ between lisaconstants:UserWarning",
]
xfail_strict = true

[tool.coverage.run]
source = ["mixed_signals"]
branch = true
# ? Coverage misses the return line of a marimo cell and a cell that a test overrides.
omit = ["*/mixed_signals/report/notebook.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
