name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ! Actions are pinned by commit SHA, so a moved tag cannot change what CI runs.
# ! Bump each SHA together with its version comment.
jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install the project
        run: uv sync --locked
      - name: Pre-commit hygiene hooks
        # * Ruff and the style rules have their own steps, and `uv sync --locked`
        # * already checks the lockfile.
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format,style-rules,uv-lock
      - name: Ruff lint
        run: uv run --frozen ruff check --output-format=github
      - name: Ruff format
        run: uv run --frozen ruff format --check
      - name: Style rules
        run: uv run --frozen python scripts/check_style.py
      - name: Strict mypy
        run: uv run --frozen mypy

  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --locked
      - name: Run the CPU test suite
        run: uv run --frozen pytest --cov --cov-report=term-missing

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install the project with the docs group
        run: uv sync --locked --group docs
      - name: Build the HTML docs with warnings as errors
        run: uv run --frozen --group docs sphinx-build -W --keep-going -b html docs docs/_build/html
